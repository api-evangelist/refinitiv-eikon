specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Refinitiv Eikon
providerId: refinitiv-eikon
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Financial Data
  - Market Data
description: FinOps shape for Refinitiv Eikon, retired June 30, 2025 and superseded by LSEG Workspace.
  Spend is per-seat subscription via the LSEG contract; there is no usage-based meter to reconcile.
sources:
  - https://www.lseg.com/en/data-analytics/products/eikon-trading-software
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: London Stock Exchange Group plc
serviceCategory: Market Data
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD (settlement varies)
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Refinitiv Eikon
  ServiceCategory: Market Data
  ProviderName: LSEG
  PublisherName: London Stock Exchange Group plc
  InvoiceIssuerName: London Stock Exchange Group plc
  BillingCurrency: USD
meters:
  - name: licensed_users
    unit: seat
    aggregation: sum
    dimensions:
      - entitlement
principles:
  - name: Visibility
    description: Visibility comes from the LSEG monthly invoice and the entitlement report listing active
      Eikon/Workspace seats; no API-level usage meter is exposed.
  - name: Allocation
    description: Allocate per licensed user (trader, analyst, RM); map each seat to a cost center in
      the entitlement system.
  - name: Optimization
    description: Optimization is seat hygiene — reclaim seats from inactive users, migrate from Eikon
      to LSEG Workspace before contract renewal, and right-size data-set entitlements.
  - name: Accountability
    description: Owner is the market-data licensing administrator who manages LSEG entitlements; renewals
      and seat changes flow through that role.
notes: Per-seat subscription only; no API request meter exists. Generic FOCUS request meters and per-call
  dimensions removed.
maintainers:
