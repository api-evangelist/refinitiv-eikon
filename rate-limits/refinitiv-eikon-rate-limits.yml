specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Refinitiv Eikon
providerId: refinitiv-eikon
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Financial Data
  - Market Data
  - Trading
description: Eikon Data API limits (request frequency, data volume per call, concurrent sessions) were
  enforced through the local Eikon/Workspace desktop session rather than via documented HTTP rate-limit
  headers, and exact published numbers depended on the licensed entitlement. Eikon was withdrawn June
  30, 2025; equivalent throttling now lives inside LSEG Workspace.
sources:
  - https://www.lseg.com/en/data-analytics/products/eikon-trading-software
  - https://developers.lseg.com/
notes: No public, single-page rate-limit reference; limits were enforced locally by the Eikon/Workspace
  session and tied to the user's contract entitlement.
limits:
  - name: Eikon/Workspace session-bound throttling
    scope: desktop session
    metric: varies
    limit: 'see LSEG Workspace contractual entitlement'
policies:
  - name: Session-Tied Throttling
    description: Eikon Data API calls were authenticated through an active Eikon/Workspace desktop session;
      throttling and concurrency caps were enforced by the local session and the user's licensed entitlement.
  - name: Product Withdrawal
    description: Eikon was retired June 30, 2025. Active integrations should migrate to LSEG Workspace
      / LSEG Data Library, which carry their own contract-bound limits.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
