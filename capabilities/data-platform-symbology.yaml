naftiko: 1.0.0-alpha2
info:
  label: Refinitiv Eikon Refinitiv Data Platform APIs — Symbology
  description: 'Refinitiv Eikon Refinitiv Data Platform APIs — Symbology. 1 operations. Lead operation: Look Up Instrument
    Symbology. Self-contained Naftiko capability covering one Refinitiv Eikon business surface.'
  tags:
  - Refinitiv Eikon
  - Symbology
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    REFINITIV_EIKON_API_KEY: REFINITIV_EIKON_API_KEY
capability:
  consumes:
  - type: http
    namespace: data-platform-symbology
    baseUri: https://api.refinitiv.com
    description: Refinitiv Eikon Refinitiv Data Platform APIs — Symbology business capability. Self-contained, no shared references.
    resources:
    - name: discovery-symbology-v1-lookup
      path: /discovery/symbology/v1/lookup
      operations:
      - name: lookupsymbology
        method: POST
        description: Look Up Instrument Symbology
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.REFINITIV_EIKON_API_KEY}}'
  exposes:
  - type: rest
    namespace: data-platform-symbology-rest
    port: 8080
    description: REST adapter for Refinitiv Eikon Refinitiv Data Platform APIs — Symbology. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/discovery/symbology/v1/lookup
      name: discovery-symbology-v1-lookup
      description: REST surface for discovery-symbology-v1-lookup.
      operations:
      - method: POST
        name: lookupsymbology
        description: Look Up Instrument Symbology
        call: data-platform-symbology.lookupsymbology
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: data-platform-symbology-mcp
    port: 9090
    transport: http
    description: MCP adapter for Refinitiv Eikon Refinitiv Data Platform APIs — Symbology. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: look-up-instrument-symbology
      description: Look Up Instrument Symbology
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: data-platform-symbology.lookupsymbology
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
