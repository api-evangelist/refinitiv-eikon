naftiko: 1.0.0-alpha2
info:
  label: Refinitiv Eikon LSEG DataScope Select REST API — Schedules
  description: 'Refinitiv Eikon LSEG DataScope Select REST API — Schedules. 2 operations. Lead operation: List Extraction
    Schedules. Self-contained Naftiko capability covering one Refinitiv Eikon business surface.'
  tags:
  - Refinitiv Eikon
  - Schedules
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    REFINITIV_EIKON_API_KEY: REFINITIV_EIKON_API_KEY
capability:
  consumes:
  - type: http
    namespace: datascope-select-schedules
    baseUri: https://selectapi.datascope.refinitiv.com/RestApi/v1
    description: Refinitiv Eikon LSEG DataScope Select REST API — Schedules business capability. Self-contained, no shared
      references.
    resources:
    - name: Schedules
      path: /Schedules
      operations:
      - name: listschedules
        method: GET
        description: List Extraction Schedules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createschedule
        method: POST
        description: Create an Extraction Schedule
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.REFINITIV_EIKON_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: datascope-select-schedules-rest
    port: 8080
    description: REST adapter for Refinitiv Eikon LSEG DataScope Select REST API — Schedules. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/schedules
      name: schedules
      description: REST surface for Schedules.
      operations:
      - method: GET
        name: listschedules
        description: List Extraction Schedules
        call: datascope-select-schedules.listschedules
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createschedule
        description: Create an Extraction Schedule
        call: datascope-select-schedules.createschedule
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: datascope-select-schedules-mcp
    port: 9090
    transport: http
    description: MCP adapter for Refinitiv Eikon LSEG DataScope Select REST API — Schedules. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: list-extraction-schedules
      description: List Extraction Schedules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: datascope-select-schedules.listschedules
      outputParameters:
      - type: object
        mapping: $.
    - name: create-extraction-schedule
      description: Create an Extraction Schedule
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: datascope-select-schedules.createschedule
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
